name: Update Feeds

on:
  schedule:
    - cron: "7,37 * * * *"   # every 30 minutes (at :07 and :37, since GitHub is busiest right on the hour)
  workflow_dispatch:          # adds a "Run workflow" button so you can run it any time
  push:
    branches: [main]
    paths-ignore:             # runs after any change except your reading progress and bookmarks
      - "State.json"
      - "Bookmarks/**"
      - "README.md"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install feed tools
        run: pip install feedparser nh3 requests

      # Brings back the posts saved by the last run, so posts that have
      # dropped off a website's feed are still kept for 30 days.
      - name: Restore saved posts
        uses: actions/cache/restore@v5
        with:
          path: data
          key: reader-data-${{ github.run_id }}
          restore-keys: reader-data-

      - name: Fetch feeds
        run: python3 "Fetch Feeds.py"

      - name: Save posts for the next run
        uses: actions/cache/save@v5
        with:
          path: data
          key: reader-data-${{ github.run_id }}

      - name: Put the site together
        run: |
          mkdir site
          cp index.html Reader.css Reader.js Manifest.json Icon.svg Icon-192.png Icon-512.png "Service Worker.js" site/
          cp -r data site/data

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
